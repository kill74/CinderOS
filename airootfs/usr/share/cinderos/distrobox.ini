[rust-dev]
image=docker.io/library/archlinux:latest
additional_packages="rustup gcc pkgconf git"
init_hooks="rustup default stable"

[node-dev]
image=docker.io/library/archlinux:latest
additional_packages="nodejs npm yarn pnpm git"

[python-dev]
image=docker.io/library/archlinux:latest
additional_packages="python python-pip python-poetry git base-devel"
