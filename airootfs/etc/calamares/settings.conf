modules-search:
  - local
  - /usr/lib/calamares/modules

instances:
  - id: partition
    module: partition
    config: partition.conf
  - id: cinderos-post
    module: shellprocess
    config: shellprocess-cinderos-post.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - shellprocess@cinderos-post
      - bootloader
      - umount
  - show:
      - finished

branding: cinderos
prompt-install: true
