extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: bind
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: bind
  - device: /run/systemd/resolve
    mountPoint: /run/systemd/resolve
    options: bind

extraMountsEfi:
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars

btrfsSwapSubvol: /@swap

btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/log
    subvolume: /@var_log
  - mountPoint: /var/cache
    subvolume: /@var_cache
  - mountPoint: /var/tmp
    subvolume: /@var_tmp
  - mountPoint: /tmp
    subvolume: /@tmp
  - mountPoint: /.snapshots
    subvolume: /@snapshots

mountOptions:
  - filesystem: default
    options: [ defaults, noatime ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
  - filesystem: btrfs
    options: [ defaults, noatime, compress=zstd:1, space_cache=v2, autodefrag ]
  - filesystem: btrfs_swap
    options: [ defaults, noatime ]

