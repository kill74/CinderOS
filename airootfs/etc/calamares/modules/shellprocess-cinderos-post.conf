dontChroot: false
timeout: 300
script:
  - "rm -f /etc/sudoers.d/00-cinderos-live"
  - "printf '%%wheel ALL=(ALL:ALL) ALL\\n' > /etc/sudoers.d/10-wheel"
  - "chmod 440 /etc/sudoers.d/10-wheel"
  - "rm -f /usr/share/applications/cinder-install.desktop"
  - "rm -f /usr/local/bin/cinder-install /etc/calamares/scripts/cinder-install"
  - "find /home /etc/skel -maxdepth 3 -name 'Install CinderOS.desktop' -delete || true"
  - "cp /etc/greetd/config.installed.toml /etc/greetd/config.toml || true"
  - "rm -f /etc/greetd/config.installed.toml"
  - "mkdir -p /boot/grub/themes"
  - "cp -a /usr/share/grub/themes/cinderos /boot/grub/themes/cinderos || true"
  - "sed -i 's|^GRUB_THEME=.*|GRUB_THEME=\"/boot/grub/themes/cinderos/theme.txt\"|' /etc/default/grub || true"
  - "plymouth-set-default-theme -R cinderos || true"
  - "cinder-hardware-setup || true"
  - "cinder-memory low-idle || true"
  - "systemctl enable NetworkManager systemd-resolved ufw apparmor upower seatd greetd systemd-timesyncd power-profiles-daemon switcheroo-control earlyoom cinder-hardware-setup || true"
  - "systemctl disable bluetooth docker cups fwupd systemd-oomd cinder-snapshot-setup sshd fail2ban usbguard clamav-daemon clamav-freshclam auditd || true"
  - "systemctl disable snapper-timeline.timer snapper-cleanup.timer snapper-boot.timer grub-btrfsd.service btrfsmaintenance-refresh.path || true"
  - "systemctl disable systemd-networkd || true"
  - "systemctl mask systemd-rfkill.service systemd-rfkill.socket || true"
  - "ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf || true"
  - "ufw default deny incoming || true"
  - "ufw default allow outgoing || true"
  - "ufw --force enable || true"
  - "sysctl --system || true"
  - "passwd -l root || true"
