# CinderOS Premium Kitty Terminal

# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Window padding and aesthetic
window_padding_width 12
background_opacity   0.95
hide_window_decorations yes
confirm_os_window_close 0

# Colors (Cinder Theme)
background #1e1e2e
foreground #cdd6f4
selection_background #313244
selection_foreground #cdd6f4

# Cursor
cursor #f38ba8
cursor_text_color #11111b
cursor_shape block

# URL
url_color #89b4fa
url_style curly

# Normal Colors
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de

# Bright Colors
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8
