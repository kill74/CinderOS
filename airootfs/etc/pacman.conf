#
# CinderOS live system pacman configuration.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 10
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

#[cachyos]
# CinderOS audit note:
# Keep unofficial performance repos disabled by default unless their keyring
# and mirrorlist are installed and signatures are required.
#SigLevel = PackageRequired
#Include = /etc/pacman.d/cachyos-mirrorlist

